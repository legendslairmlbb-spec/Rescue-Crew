[project]
name = "rescue-crew"
version = "0.1.0"
description = "Rescue Crew"
readme = "README.md"
authors = [
    { name = "legendslairmlbb-spec", email = "legendslairmlbb@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp<4",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.8.3",
    "mcp>=1.24,<2",
]

[project.scripts]
rescue-crew = "rescue_crew:main"
rescue-crew-check-llm = "rescue_crew.llm:check"
rescue-crew-run = "rescue_crew.run:main"
rescue-crew-report = "rescue_crew.run:report_main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".specify"]
